[package]
name = "aec3_py"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "aec3_py"
crate-type = ["cdylib"]

[dependencies]
# PyO3 extension module
pyo3 = { version = "0.29", features = ["extension-module"] }

# NumPy bindings for PyO3
numpy = "0.29"

# AEC3 crate (published version range; adjust if you want a specific patch)
aec3 = "0.4.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
