# Minimal library manifest for the patched aec3 0.4.0 sources.
[package]
edition = "2024"
name = "aec3"
version = "0.4.0"
authors = ["Angelos-Ermis Mangos"]
build = false
exclude = ["tests/test_data/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An acoustic echo canceller written in rust based on the WebRTC aec3 project"
categories = ["multimedia::audio"]
license = "MIT OR BSD-3-Clause"
repository = "https://github.com/RubyBit/aec3-rs"

[features]
diagnostics = [
    "dep:postcard",
    "dep:serde",
    "dep:hound",
]

[lib]
name = "aec3"
path = "src/lib.rs"

[dependencies.crossbeam-channel]
version = "0.5.15"

[dependencies.hound]
version = "3"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.num-complex]
version = "0.4.6"

[dependencies.postcard]
version = "1.1.3"
features = ["alloc"]
optional = true
default-features = false

[dependencies.rustfft]
version = "6.4.1"

[dependencies.serde]
version = "1.0.219"
features = ["derive"]
optional = true
